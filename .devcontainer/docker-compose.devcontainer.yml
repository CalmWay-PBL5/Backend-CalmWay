services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.devcontainer
    env_file:
      - ../flying-class-backend/.env
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../flying-class-backend:/app:cached
      - backend_node_modules:/app/node_modules
    command: ["sleep", "infinity"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../flying-class-backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../flying-class-backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flyingclass_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  backend_node_modules:
  pgdata:
  redisdata:
