services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.devcontainer
    init: true
    env_file:
      - ../.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ..:/app:cached
      - backend_node_modules:/app/node_modules
    command: ["sleep", "infinity"]

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-flyingclass_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: >
      /bin/sh -c "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
    env_file:
      - ../.env
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: flying-class-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" 
      - "9001:9001" 
    env_file:
      - ../.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s 
      timeout: 5s
      retries: 3

  minio-setup:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../.env
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb local/$${S3_BUCKET_NAME} --ignore-existing;
      /usr/bin/mc anonymous set download local/$${S3_BUCKET_NAME};
      exit 0;
      "

volumes:
  backend_node_modules:
  pgdata:
  redisdata:
  minio_data: